<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0f172a"><title>Ôn luyện Vật lí 12 – Cô Tiên</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:#0f172a;color:#e2e8f0;font-size:16px}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.65}h1,h2,p{margin-top:0}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:24px}.center{text-align:center;max-width:690px;margin:9vh auto}.title{color:#67e8f9;font-weight:900}.sub{color:#94a3b8}.primary{border:0;background:#22d3ee;color:#082f49;border-radius:12px;padding:13px 21px;font-weight:800}.secondary{background:#334155;color:#e2e8f0;border:1px solid #475569;border-radius:9px;padding:10px 14px}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}.sidebar{align-self:start}.group{margin:19px 0 8px;color:#94a3b8;font-size:12px;font-weight:800;letter-spacing:.07em}.numbers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.num{border:1px solid #475569;background:#334155;color:#fff;border-radius:7px;padding:9px 0;font-weight:700}.num.on{outline:2px solid #22d3ee}.num.good{background:#166534;border-color:#4ade80}.num.bad{background:#7f1d1d;border-color:#f87171}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}.prompt{font-size:20px;line-height:1.6;font-weight:600;white-space:pre-line;margin-bottom:22px}.option{display:block;width:100%;text-align:left;color:#e2e8f0;background:#334155;border:1px solid #475569;border-radius:12px;padding:15px;margin:10px 0;line-height:1.5}.option.good,.tfbtn.good{background:#14532d;border-color:#4ade80}.option.bad,.tfbtn.bad{background:#7f1d1d;border-color:#fb7185}.letter{color:#67e8f9;font-weight:900;margin-right:10px}.tfrow{padding:12px 0;border-bottom:1px solid #475569;display:flex;justify-content:space-between;gap:14px;align-items:center}.tftext{flex:1;line-height:1.5}.tfcontrol{display:flex;gap:8px}.tfbtn{background:#334155;border:1px solid #64748b;color:white;border-radius:8px;padding:9px 12px;font-weight:700}.tfbtn.selected{background:#0e7490;border-color:#22d3ee}.feedback{background:#0f2533;border-radius:10px;padding:13px;margin-top:18px;line-height:1.6}.bottom{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}input{width:100%;border:2px solid #0891b2;background:#0f172a;color:white;border-radius:12px;padding:14px;font-size:19px}#content{min-width:0}.foot{text-align:center;color:#64748b;font-size:12px;padding:16px}@media(max-width:650px){.wrap{padding:10px}.layout{grid-template-columns:1fr;gap:12px}.card{padding:17px}.center{margin:7vh auto}.sidebar .numbers{grid-template-columns:repeat(10,minmax(0,1fr))}.sidebar{order:2}.main{order:1}.num{padding:8px 0;font-size:12px}.prompt{font-size:17px}.tfrow{display:block}.tfcontrol{margin-top:12px}.title{font-size:22px}}
</style></head><body><div id="app" class="wrap"></div><script>
const original=[{"id": 1, "type": "mc", "q": "Sự nóng chảy là sự chuyển từ:", "options": ["Thể lỏng sang thể rắn", "Thể rắn sang thể khí", "Thể rắn sang thể lỏng", "Thể lỏng sang thể khí"], "answer": 2}, {"id": 2, "type": "mc", "q": "Trong công nghiệp, người ta nấu chảy kim loại rồi đổ vào khuôn. Kim loại đã xảy ra hình thức chuyển thể nào?", "options": ["Đông đặc", "Ngưng kết", "Thăng hoa", "Nóng chảy"], "answer": 3}, {"id": 3, "type": "mc", "q": "Vì sao khi nhiệt độ Trái Đất tăng lên, mực nước biển dâng cao?", "options": ["Nước biển giãn nở và mặt đất trở nên bằng phẳng hơn", "Nước biển giãn nở và đáy biển dâng lên", "Nước bay hơi, mưa nhiều hơn nên mực nước biển dâng", "Nước biển giãn nở do nhiệt và băng trên đất liền tan chảy"], "answer": 3}, {"id": 4, "type": "mc", "q": "Thế năng phân tử phụ thuộc vào yếu tố nào?", "options": ["Tốc độ chuyển động của phân tử", "Nhiệt độ của vật", "Thể tích của vật", "Khoảng cách giữa các phân tử"], "answer": 3}, {"id": 5, "type": "mc", "q": "Hệ thức nào mô tả vật vừa nhận nhiệt lượng, vừa nhận công?", "options": ["ΔU = A + Q, Q > 0, A < 0", "ΔU = A + Q, Q < 0, A < 0", "ΔU = A + Q, Q < 0, A > 0", "ΔU = A + Q, Q > 0, A > 0"], "answer": 3}, {"id": 6, "type": "mc", "q": "Cung cấp cho vật một công 500 J, vật mất ra môi trường 300 J nhiệt lượng. Nội năng thay đổi bao nhiêu?", "options": ["Giảm 300 J", "Giảm 200 J", "Tăng 200 J", "Tăng 300 J"], "answer": 2}, {"id": 7, "type": "mc", "q": "Khi hai vật khác nhiệt độ tiếp xúc, nhiệt năng truyền như thế nào?", "options": ["Từ vật nóng sang vật lạnh", "Từ vật lạnh sang vật nóng", "Không có sự truyền nhiệt", "Lập tức cân bằng nhiệt"], "answer": 0}, {"id": 8, "type": "mc", "q": "Trong thang Kelvin, nhiệt độ nước sôi ở áp suất tiêu chuẩn gần bằng:", "options": ["273 K", "212 K", "373 K", "312 K"], "answer": 2}, {"id": 9, "type": "mc", "q": "Một vật nóng từ 0°C lên 120°C thì độ tăng nhiệt độ theo thang Kelvin là:", "options": ["273 K", "393,15 K", "237 K", "120 K"], "answer": 3}, {"id": 10, "type": "mc", "q": "Nhiệt độ mà nước cùng tồn tại ở ba thể cân bằng được gọi là:", "options": ["Nhiệt độ đặc biệt", "Độ không tuyệt đối", "Nhiệt độ đóng băng", "Nhiệt độ điểm ba của nước"], "answer": 3}, {"id": 11, "type": "mc", "q": "Với cùng một chất, quá trình nào làm giảm lực tương tác giữa các phân tử nhiều nhất?", "options": ["Nóng chảy", "Đông đặc", "Hóa hơi", "Ngưng tụ"], "answer": 2}, {"id": 12, "type": "mc", "q": "Phát biểu nào không đúng về nhiệt hóa hơi riêng?", "options": ["Kí hiệu L", "Chất lỏng có thể hóa hơi ở nhiều nhiệt độ", "Các chất cùng khối lượng có nhiệt hóa hơi riêng như nhau", "Đơn vị J/kg"], "answer": 2}, {"id": 13, "type": "mc", "q": "Biết c của đồng = 380 J/(kg.K). Nhiệt lượng để làm nóng 300 g đồng từ 15°C đến 60°C là:", "options": ["5130 J", "5130 kJ", "6840 J", "6840 kJ"], "answer": 0}, {"id": 14, "type": "mc", "q": "Hai nhiệt độ mốc truyền thống của thang Celsius là:", "options": ["Nhiệt độ đông đặc và sôi của thiếc", "Nhiệt độ nước đá tan và nước sôi ở áp suất tiêu chuẩn", "Nhiệt độ đông đặc và sôi của rượu", "Nhiệt độ đông đặc và sôi của thủy ngân"], "answer": 1}, {"id": 15, "type": "mc", "q": "Theo mô hình động học phân tử, các chất:", "options": ["Liền một khối, không có khoảng cách giữa phân tử", "Được cấu tạo từ các hạt riêng biệt rất nhỏ", "Không có cấu trúc hạt", "Có phân tử luôn đứng yên"], "answer": 1}, {"id": 16, "type": "mc", "q": "Trường hợp nội năng của vật thay đổi không phải do truyền nhiệt:", "options": ["Xoa hai bàn tay vào nhau cho ấm", "Đặt chậu nước ngoài nắng", "Không khí lạnh đi khi gió mùa tràn về", "Bát nóng lên khi đựng cơm nóng"], "answer": 0}, {"id": 17, "type": "mc", "q": "Phát biểu nào không đúng về thang Celsius?", "options": ["Kí hiệu nhiệt độ t", "Đơn vị °C", "1°C tương đương với 273 K", "Nước đá đang tan ở áp suất 1 atm là 0°C"], "answer": 2}, {"id": 18, "type": "mc", "q": "Cho c của nước = 4200 J/(kg.K), L = 2,26×10⁶ J/kg. Để 2 kg nước ở 30°C hóa hơi hoàn toàn ở 100°C cần:", "options": ["51,08 J", "51,08 kJ", "510 800 J", "5 108 000 J"], "answer": 3}, {"id": 19, "type": "mc", "q": "Một nhà máy luyện 10 tấn thép ở nhiệt độ nóng chảy. Nhiệt nóng chảy riêng là 2,77×10⁵ J/kg. Nhiệt lượng cần là:", "options": ["2,77×10⁹ J", "2,77×10⁹ kJ", "2,77×10⁶ J", "2,77×10³ kJ"], "answer": 0}, {"id": 20, "type": "mc", "q": "Cần trộn bao nhiêu nước sôi ở 100°C với nước 10°C để có 30 kg nước ở 40°C? Bỏ qua hao phí.", "options": ["10 kg nóng – 20 kg lạnh", "15 kg nóng – 15 kg lạnh", "20 kg nóng – 10 kg lạnh", "25 kg nóng – 5 kg lạnh"], "answer": 0}, {"id": 21, "type": "tf", "q": "Khối kim loại 2 kg được nung bởi lò công suất 200 W trong 5 phút, tăng từ 20°C lên 51°C; bỏ qua hao phí.", "statements": ["Năng lượng lò cung cấp là 6000 J.", "Nhiệt dung riêng của khối kim loại xấp xỉ 967,7 J/(kg.K).", "Cứ nhiệt độ tăng cao thì nhiệt lượng cung cấp phải tăng gấp đôi.", "Nếu khối lượng giảm một nửa với cùng nhiệt lượng thì nhiệt độ cuối là 62°C."], "correct": [false, true, false, false]}, {"id": 22, "type": "tf", "q": "Nhiệt độ nóng chảy: nhôm 660°C, nước đá 0°C, rượu −117°C, sắt 1535°C, đồng 1083°C, thủy ngân −39°C, muối ăn 801°C.", "statements": ["Rượu có nhiệt độ nóng chảy cao nhất.", "Thủy ngân có nhiệt độ nóng chảy thấp nhất.", "Có thể dùng nhiệt kế rượu phù hợp đo −50°C.", "Có thể dùng nhiệt kế thủy ngân thông thường đo −50°C."], "correct": [false, false, true, false]}, {"id": 23, "type": "sa", "q": "Khí nhận nhiệt lượng 520 J và thực hiện công 250 J khi giãn nở. Tính độ biến thiên nội năng của khí (J).", "answer": 270, "explanation": "ΔU = 520 − 250 = 270 J."}, {"id": 24, "type": "sa", "q": "Thả quả cầu nhôm 0,5 kg ở 100°C vào nước 20°C. Nhiệt độ cân bằng 35°C. Tính khối lượng nước (kg), làm tròn 2 chữ số thập phân. c nhôm = 880, c nước = 4200 J/(kg.K).", "answer": 0.45, "explanation": "m = (0,5 × 880 × 65)/(4200 × 15) ≈ 0,45 kg."}, {"id": 25, "type": "sa", "q": "Thả 0,5 kg đồng ở 80°C vào 500 g nước. Đồng nguội đến 20°C. Nước nóng lên thêm bao nhiêu °C (làm tròn hai chữ số thập phân)? c đồng = 380; c nước = 4200 J/(kg.K).", "answer": 5.43, "explanation": "Δt = 0,5 × 380 × 60/(0,5 × 4200) ≈ 5,43°C."}, {"id": 26, "type": "sa", "q": "Nung khối sắt 5 kg bằng lò công suất 2000 W trong 3 phút, bỏ qua hao phí. c sắt = 440 J/(kg.K). Khối sắt tăng thêm bao nhiêu °C (làm tròn hàng đơn vị)?", "answer": 164, "explanation": "Δt = 2000 × 180/(5 × 440) ≈ 163,64°C → 164°C."}];
const app=document.getElementById('app');let questions=[],answers={},idx=0,started=false,finished=false;
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){questions=[...shuffle(original.filter(q=>q.type==='mc')).map(q=>({...q,options:shuffle(q.options.map((text,i)=>({text,i})))})),...shuffle(original.filter(q=>q.type==='tf')).map(q=>({...q,statements:shuffle(q.statements.map((text,i)=>({text,correct:q.correct[i],i})))})),...shuffle(original.filter(q=>q.type==='sa'))];idx=0;answers={};started=true;finished=false;render()}
function escapeHtml(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function done(q){let a=answers[q.id];return q.type==='mc'?!!a:!!a?.submitted}
function total(){return questions.filter(q=>answers[q.id]?.isCorrect).length}
function local(q){return questions.filter(x=>x.type===q.type).findIndex(x=>x.id===q.id)+1}
function bind(selector,fn){document.querySelectorAll(selector).forEach(el=>el.addEventListener('click',()=>fn(el)))}
function render(){if(!started){app.innerHTML=`<section class="card center"><h1 class="title">ÔN LUYỆN GIỮA KÌ I</h1><h2>VẬT LÍ 12 – LỚP CÔ TIÊN</h2><p class="sub">Trung tâm GDNN – GDTX Lâm Hà, Lâm Đồng</p><p>20 câu trắc nghiệm · 2 câu đúng/sai · 4 câu trả lời ngắn</p><button class="primary" id="start">BẮT ĐẦU ÔN TẬP</button></section>`;document.getElementById('start').onclick=reset;return}
if(finished){let s=total();app.innerHTML=`<section class="card center"><h1 class="title">KẾT QUẢ ÔN TẬP</h1><div style="font-size:55px;font-weight:900;margin:22px 0"><span class="title">${s}</span> / 26</div><p>${s===26?'Xuất sắc! Bạn đã nắm chắc kiến thức.':s>=21?'Rất tốt! Hãy xem lại các câu sai.':s>=13?'Khá tốt! Tiếp tục luyện tập nhé.':'Hãy ôn tập thêm và thử lại nhé.'}</p><p class="sub">Số câu đúng: ${s} · Số câu chưa đúng: ${26-s}</p><button class="primary" id="restart">LÀM LẠI TỪ ĐẦU</button> <button class="secondary" id="review">XEM LẠI BÀI</button></section>`;document.getElementById('restart').onclick=reset;document.getElementById('review').onclick=()=>{finished=false;idx=0;render()};return}
let q=questions[idx],a=answers[q.id],d=done(q);let labels=['A','B','C','D'];let body='';
if(q.type==='mc'){body=q.options.map((o,i)=>`<button class="option ${d?(o.i===q.answer?'good':a.selected===o.i?'bad':''):''}" data-mc="${o.i}" ${d?'disabled':''}><span class="letter">${labels[i]}.</span>${escapeHtml(o.text)}${d&&o.i===q.answer?' ✓':d&&a.selected===o.i?' ✗':''}</button>`).join('');if(d)body+=`<div class="feedback" style="color:${a.isCorrect?'#86efac':'#fda4af'}">${a.isCorrect?'✓ Chính xác!':'✗ Chưa đúng. Đáp án đúng được tô xanh.'}</div>`}
else if(q.type==='tf'){body=q.statements.map((s,i)=>{let choice=a?.choices?.[s.i];return `<div class="tfrow"><div class="tftext"><b class="letter">${'abcd'[i]})</b>${escapeHtml(s.text)}${d?`<div style="font-size:13px;color:${choice===s.correct?'#86efac':'#fda4af'}">${choice===s.correct?'✓ Đúng':'✗ Đáp án đúng: '+(s.correct?'ĐÚNG':'SAI')}</div>`:''}</div><div class="tfcontrol"><button class="tfbtn ${choice===true?(d?(s.correct?'good':'bad'):'selected'):''}" data-tf="${s.i}" data-choice="true" ${d?'disabled':''}>ĐÚNG</button><button class="tfbtn ${choice===false?(d?(!s.correct?'good':'bad'):'selected'):''}" data-tf="${s.i}" data-choice="false" ${d?'disabled':''}>SAI</button></div></div>`}).join('');body+=d?`<div class="feedback">${a.isCorrect?'✓ Chính xác cả 4 ý!':'Bạn đúng '+a.count+'/4 ý.'}</div>`:`<button id="checktf" class="primary" style="margin-top:16px;width:100%" ${Object.keys(a?.choices||{}).length<4?'disabled':''}>KIỂM TRA</button>`}
else {body=`<input id="saInput" type="text" inputmode="decimal" placeholder="Nhập kết quả (ví dụ: 0,45)" value="${escapeHtml(a?.value||'')}" ${d?'disabled':''}>`;body+=d?`<div class="feedback" style="color:${a.isCorrect?'#86efac':'#fda4af'}">${a.isCorrect?'✓ Chính xác!':'✗ Đáp án đúng: '+String(q.answer).replace('.',',')}<div class="sub" style="margin-top:6px">${escapeHtml(q.explanation)}</div></div>`:'<button class="primary" id="checksa" style="margin-top:14px;width:100%">KIỂM TRA ĐÁP ÁN</button>'}
let sidebar=`<aside class="card sidebar"><div class="title" style="text-align:center;font-size:17px">VẬT LÍ 12 – CÔ TIÊN</div><p class="sub" style="font-size:12px;text-align:center">TT GDNN – GDTX Lâm Hà</p>${[['mc','I. TRẮC NGHIỆM'],['tf','II. ĐÚNG / SAI'],['sa','III. TRẢ LỜI NGẮN']].map(([type,t])=>`<div class="group">${t}</div><div class="numbers">${questions.map((x,i)=>x.type===type?`<button class="num ${i===idx?'on':''} ${done(x)?(answers[x.id]?.isCorrect?'good':'bad'):''}" data-nav="${i}">${local(x)}</button>`:'').join('')}</div>`).join('')}<p class="sub" style="text-align:center;margin-top:20px">Hoàn thành: ${questions.filter(done).length}/26</p></aside>`;
app.innerHTML=`<div class="layout">${sidebar}<main class="main" id="content"><div class="top"><h2 class="title" style="margin:0;font-size:20px">Phần ${q.type==='mc'?'I – Trắc nghiệm':q.type==='tf'?'II – Đúng/Sai':'III – Trả lời ngắn'} · Câu ${local(q)}</h2><strong>Điểm: <span class="title">${total()}</span></strong></div><section class="card"><div class="prompt">${escapeHtml(q.q)}</div>${body}</section><div class="bottom"><button id="prev" class="secondary" ${idx===0?'disabled':''}>← CÂU TRƯỚC</button>${d?`<button class="primary" id="next">${questions.every(done)?'XEM KẾT QUẢ':'CÂU TIẾP THEO'} →</button>`:'<span class="sub">Hoàn thành câu hiện tại để tiếp tục.</span>'}</div></main></div><div class="foot">Ôn luyện Vật lí 12 · Hoạt động ngoại tuyến · Không thu thập thông tin học sinh</div>`;
bind('[data-nav]',el=>{idx=Number(el.dataset.nav);render()});bind('[data-mc]',el=>{if(d)return;let selected=Number(el.dataset.mc);answers[q.id]={selected,isCorrect:selected===q.answer};render()});bind('[data-tf]',el=>{if(d)return;let old=answers[q.id]||{choices:{}};answers[q.id]={...old,choices:{...old.choices,[el.dataset.tf]:el.dataset.choice==='true'}};render()});document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render()}};
let checkTf=document.getElementById('checktf');if(checkTf)checkTf.onclick=()=>{let old=answers[q.id];if(!old||Object.keys(old.choices).length!==4)return;let count=q.statements.filter(s=>old.choices[s.i]===s.correct).length;answers[q.id]={...old,count,submitted:true,isCorrect:count===4};render()};
let checkSa=document.getElementById('checksa');if(checkSa){let field=document.getElementById('saInput');const submit=()=>{let val=field.value.trim();if(!val)return;let n=Number(val.replace(',','.'));answers[q.id]={value:val,submitted:true,isCorrect:Number.isFinite(n)&&Math.abs(n-q.answer)<.005};render()};checkSa.onclick=submit;field.onkeydown=e=>{if(e.key==='Enter')submit()}}
let next=document.getElementById('next');if(next)next.onclick=()=>{if(questions.every(done)){finished=true;render();return}let i=questions.findIndex((x,i)=>i>idx&&!done(x));if(i===-1)i=questions.findIndex(x=>!done(x));idx=i;render()};}
render();
</script></body></html>
